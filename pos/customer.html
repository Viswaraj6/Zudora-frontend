<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customers</title>

    <link rel="stylesheet" href="css/customer.css">
</head>
<body>

<div class="customer-page">

    <div class="topbar">

        <button class="back-btn" onclick="history.back()">
            ←
        </button>

       <h2 id="pageTitle">Customers</h2>

    </div>

    <div class="search-box">

        <input
            type="text"
            id="customerSearch"
            placeholder="Search Mobile or Name">

    </div>

    
    <div id="customerList" class="customer-list">

    </div>


<div id="customerDropdown" class="customer-dropdown hidden">

    <div id="customerResults"></div>

    <div id="customerCreate" class="hidden">

        <div id="noCustomerMsg">
            Customer Not Found
        </div>

        <button id="createCustomerBtn"
                class="add-btn"
                onclick="toggleCustomerForm()">
            + Add Customer
        </button>

        <div id="customerForm" class="hidden">

            <input type="text"
                   id="custName"
                   placeholder="Customer Name">

            <input type="text"
                   id="custMobile"
                   placeholder="Mobile Number"
                   maxlength="10">

            <span id="mobileStatus"
                  class="mobile-status"></span>

            <input type="email"
                   id="custEmail"
                   placeholder="Email">

            <input type="text"
                   id="custGST"
                   placeholder="GST Number (Optional)">

            <input type="text"
                   id="custAddress"
                   placeholder="Address">

            <button class="add-btn"
                    id="saveCustomerBtn"
                    onclick="saveCustomer()">
                Save Customer
            </button>

        </div>

    </div>

</div>
    </div> 
<script src="js/customer.js"></script>

</body>
</html>
