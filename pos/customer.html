<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customers</title>

    <link rel="stylesheet" href="css/customer.css">
</head>
<body>

<div class="customer-page">

    <div class="topbar">

        <button class="back-btn" onclick="history.back()">
            ←
        </button>

        <h2>Customers</h2>

    </div>

    <div class="search-box">

        <input
            type="text"
            id="customerSearch"
            placeholder="Search Mobile or Name">

    </div>

    <button class="add-btn" onclick="openAddCustomer()">
    + Add Customer
</button>
    
    <div id="customerList" class="customer-list">

    </div>
<div id="customerPopup" class="popup hidden">

    <div class="popup-box">

        <h3>Add Customer</h3>

        <input type="text" id="custName" placeholder="Customer Name">

        <input type="text" id="custMobile" placeholder="Mobile Number">

        <input type="email" id="custEmail" placeholder="Email">

        <input type="text" id="custAddress" placeholder="Address">

        <div class="popup-buttons">

            <button onclick="saveCustomer()">
                Save
            </button>

            <button onclick="closeCustomerPopup()">
                Cancel
            </button>

        </div>

    </div>

</div>
</div>

<script src="js/customer.js"></script>

</body>
</html>
